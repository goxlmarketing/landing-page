<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Editor — local tool</title>
<style>
  /* editor chrome only — the hero brings its own styles from the live page */
  #edbar{
    position:fixed; left:0; right:0; top:0; z-index:9999;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:#0e2a1c; color:#eaf3ee; padding:10px 16px;
    font:600 12.5px/1.4 Inter, system-ui, sans-serif;
  }
  #edbar b{ color:#34d399; }
  #edbar .sp{ flex:1; }
  #edbar button{
    font:700 12px Inter, system-ui, sans-serif; cursor:pointer;
    background:#10B981; color:#06231a; border:0; border-radius:999px;
    padding:8px 14px;
  }
  #edbar button.ghost{ background:transparent; color:#eaf3ee; border:1px solid rgba(255,255,255,.3); }
  #stage{ margin-top:52px; position:relative; }

  /* selection + handles */
  .ed-el{ cursor:grab; }
  .ed-el:hover{ outline:1.5px dashed rgba(16,185,129,.6); outline-offset:3px; }
  .ed-el.ed-sel{ outline:2px solid #10B981; outline-offset:3px; cursor:grabbing; }
  .ed-handle{
    position:absolute; width:14px; height:14px; right:-9px; bottom:-9px;
    background:#10B981; border:2px solid #fff; border-radius:4px;
    cursor:nwse-resize; z-index:50; display:none;
    box-shadow:0 1px 4px rgba(0,0,0,.35);
  }
  .ed-el.ed-sel .ed-handle{ display:block; }

  /* side panel */
  #edpanel{
    position:fixed; right:14px; top:64px; z-index:9998; width:250px;
    background:#fff; border:1px solid #d8cfc2; border-radius:14px;
    padding:14px 16px; font:500 12px Inter, system-ui, sans-serif; color:#16241c;
    box-shadow:0 20px 50px -20px rgba(6,20,13,.35);
  }
  #edpanel h4{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#6c7a70; margin:0 0 10px; }
  #edpanel .row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  #edpanel label{ width:58px; color:#556458; }
  #edpanel input[type=number]{ width:70px; padding:5px 7px; border:1px solid #d8cfc2; border-radius:7px; font:inherit; }
  #edpanel input[type=range]{ flex:1; }
  #edpanel .name{ font-weight:700; color:#10B981; margin-bottom:10px; word-break:break-all; }
  #edpanel hr{ border:0; border-top:1px solid #e7e0d6; margin:12px 0; }
  #edout{
    position:fixed; left:14px; bottom:14px; z-index:9998; width:460px; max-width:calc(100vw - 28px);
    display:none;
  }
  #edout textarea{
    width:100%; height:200px; font:11.5px/1.5 Consolas, monospace;
    border:1px solid #d8cfc2; border-radius:12px; padding:12px; background:#fff;
  }
</style>
</head>
<body>

<div id="edbar">
  <span><b>HERO EDITOR</b> · element par click karo → drag se move · corner handle se resize · panel se fine-tune</span>
  <span class="sp"></span>
  <button class="ghost" id="edReset">Reset all</button>
  <button id="edExport">Export layout</button>
</div>

<div id="stage">Loading the live hero…</div>

<aside id="edpanel">
  <h4>Selected element</h4>
  <div class="name" id="pName">— click any element —</div>
  <div class="row"><label>X (px)</label><input type="number" id="pX" step="1"></div>
  <div class="row"><label>Y (px)</label><input type="number" id="pY" step="1"></div>
  <div class="row"><label>Width</label><input type="number" id="pW" step="1"></div>
  <div class="row"><label>Font px</label><input type="number" id="pF" step="0.5"></div>
  <hr>
  <h4>Video framing</h4>
  <div class="row"><label>Pos X %</label><input type="range" id="vX" min="0" max="100" step="1"></div>
  <div class="row"><label>Pos Y %</label><input type="range" id="vY" min="0" max="100" step="1"></div>
  <h4>Ivory veil</h4>
  <div class="row"><label>Strength</label><input type="range" id="vVeil" min="0" max="150" step="5" value="100"></div>
</aside>

<div id="edout"><textarea id="edoutTa" readonly></textarea></div>

<script>
(async function(){
  var stage = document.getElementById('stage');

  /* ---- adopt the LIVE page's fonts, styles and hero ---- */
  var res = await fetch('/', {cache:'no-store'});
  var doc = new DOMParser().parseFromString(await res.text(), 'text/html');
  doc.querySelectorAll('link[rel="stylesheet"], link[rel="preconnect"]').forEach(function(l){
    document.head.appendChild(l.cloneNode(true));
  });
  doc.querySelectorAll('style').forEach(function(s){
    document.head.appendChild(s.cloneNode(true));
  });
  var hero = doc.querySelector('section.hero');
  if(!hero){ stage.textContent = 'Hero section nahi mila.'; return; }
  stage.innerHTML = '';
  hero = document.importNode(hero, true);
  stage.appendChild(hero);

  /* editor overrides: freeze animations, pin the hero's height */
  var ov = document.createElement('style');
  ov.textContent = [
    '.hero, .hero *{ animation:none !important; transition:none !important; }',
    '.hero{ height:calc(100vh - 52px); min-height:0 !important; overflow:hidden; }',
    '.hero-lbl{ pointer-events:auto !important; }',
    'body{ overflow-x:hidden; }'
  ].join('\n');
  document.head.appendChild(ov);

  var video = hero.querySelector('video');
  if(video){ video.play && video.play().catch(function(){}); }
  var veil = hero.querySelector('.hero-veil');

  /* measure only after the real fonts are in, or every box lies */
  if(document.fonts && document.fonts.ready){ await document.fonts.ready; }
  await new Promise(function(r){ setTimeout(r, 250); });
  if(innerWidth < 1100){
    var warn = document.createElement('div');
    warn.style.cssText = 'position:fixed;left:14px;bottom:14px;z-index:9999;background:#b45309;color:#fff;padding:10px 16px;border-radius:10px;font:600 12.5px Inter,sans-serif;';
    warn.textContent = 'Window chhoti hai — desktop layout ke liye browser ko 1100px+ chauda karke Reset all dabao.';
    document.body.appendChild(warn);
  }

  /* ---- which elements become free-floating ---- */
  var picks = [];
  hero.querySelectorAll('.hero-copy > *').forEach(function(el){ picks.push(el); });
  hero.querySelectorAll('.hero-lbl').forEach(function(el){
    if(getComputedStyle(el).display !== 'none') picks.push(el);
  });

  function nameOf(el){
    if(el.classList.contains('eyebrow')) return 'eyebrow';
    if(el.tagName === 'H1') return 'headline';
    if(el.classList.contains('hero-sub')) return 'supporting-copy';
    if(el.classList.contains('hero-actions')) return 'cta-row';
    if(el.classList.contains('hero-note')) return 'small-note';
    if(el.classList.contains('hero-steps')) return 'process-strip';
    if(el.classList.contains('hero-lbl--here') || el.classList.contains('hero-lbl--m2')) return 'label-you-are-here';
    if(el.classList.contains('hero-lbl--next') || el.classList.contains('hero-lbl--m')) return 'label-your-next-move';
    if(el.classList.contains('hero-lbl--headed') || el.classList.contains('hero-lbl--m3')) return 'label-where-headed';
    return el.className.split(' ')[0] || el.tagName.toLowerCase();
  }

  /* promote each pick to absolute, at its current visual spot */
  var heroBox = hero.getBoundingClientRect();
  var items = picks.map(function(el){
    var r = el.getBoundingClientRect();
    return { el: el, x: r.left - heroBox.left, y: r.top - heroBox.top, w: r.width, name: nameOf(el) };
  });
  items.forEach(function(it){
    var el = it.el;
    el.classList.add('ed-el');
    el.setAttribute('data-edname', it.name);
    if(el.parentElement !== hero) hero.appendChild(el);   /* out of .hero-copy, still in .hero */
    el.style.position = 'absolute';
    el.style.zIndex = 5;
    el.style.margin = '0';
    el.style.left = Math.round(it.x) + 'px';
    el.style.top = Math.round(it.y) + 'px';
    el.style.width = Math.round(it.w) + 'px';
    el.style.maxWidth = 'none';
    var h = document.createElement('span');
    h.className = 'ed-handle';
    el.appendChild(h);
  });
  var copyWrap = hero.querySelector('.hero-copy');
  if(copyWrap) copyWrap.remove();

  /* ---- selection + panel ---- */
  var sel = null;
  var pName = document.getElementById('pName'),
      pX = document.getElementById('pX'), pY = document.getElementById('pY'),
      pW = document.getElementById('pW'), pF = document.getElementById('pF');

  function select(el){
    hero.querySelectorAll('.ed-sel').forEach(function(e){ e.classList.remove('ed-sel'); });
    sel = el;
    if(!el){ pName.textContent = '— click any element —'; return; }
    el.classList.add('ed-sel');
    pName.textContent = el.getAttribute('data-edname');
    syncPanel();
  }
  function syncPanel(){
    if(!sel) return;
    pX.value = parseFloat(sel.style.left) || 0;
    pY.value = parseFloat(sel.style.top) || 0;
    pW.value = Math.round(sel.getBoundingClientRect().width);
    pF.value = parseFloat(getComputedStyle(sel).fontSize) || '';
  }
  [pX,pY,pW,pF].forEach(function(inp){
    inp.addEventListener('input', function(){
      if(!sel) return;
      if(inp===pX) sel.style.left = pX.value + 'px';
      if(inp===pY) sel.style.top = pY.value + 'px';
      if(inp===pW) sel.style.width = pW.value + 'px';
      if(inp===pF) sel.style.fontSize = pF.value + 'px';
      save();
    });
  });

  /* ---- drag + resize ---- */
  var drag = null;
  hero.addEventListener('pointerdown', function(e){
    var handle = e.target.closest('.ed-handle');
    var el = e.target.closest('.ed-el');
    if(!el) { select(null); return; }
    e.preventDefault();
    select(el);
    drag = {
      el: el, mode: handle ? 'resize' : 'move',
      sx: e.clientX, sy: e.clientY,
      ox: parseFloat(el.style.left) || 0, oy: parseFloat(el.style.top) || 0,
      ow: el.getBoundingClientRect().width,
      of: parseFloat(getComputedStyle(el).fontSize)
    };
  });
  window.addEventListener('pointermove', function(e){
    if(!drag) return;
    var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if(drag.mode === 'move'){
      drag.el.style.left = Math.round(drag.ox + dx) + 'px';
      drag.el.style.top = Math.round(drag.oy + dy) + 'px';
    }else{
      drag.el.style.width = Math.max(40, Math.round(drag.ow + dx)) + 'px';
      /* shift+resize scales the type with the box */
      if(e.shiftKey && drag.of){
        drag.el.style.fontSize = Math.max(8, drag.of * ((drag.ow + dx) / drag.ow)).toFixed(1) + 'px';
      }
    }
    syncPanel();
  });
  window.addEventListener('pointerup', function(){ if(drag){ drag = null; save(); } });

  /* arrow keys nudge the selection */
  window.addEventListener('keydown', function(e){
    if(!sel || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    var step = e.shiftKey ? 10 : 1, moved = true;
    if(e.key === 'ArrowLeft')  sel.style.left = (parseFloat(sel.style.left) - step) + 'px';
    else if(e.key === 'ArrowRight') sel.style.left = (parseFloat(sel.style.left) + step) + 'px';
    else if(e.key === 'ArrowUp')    sel.style.top  = (parseFloat(sel.style.top) - step) + 'px';
    else if(e.key === 'ArrowDown')  sel.style.top  = (parseFloat(sel.style.top) + step) + 'px';
    else moved = false;
    if(moved){ e.preventDefault(); syncPanel(); save(); }
  });

  /* ---- video + veil controls ---- */
  var vX = document.getElementById('vX'), vY = document.getElementById('vY'), vV = document.getElementById('vVeil');
  if(video){
    var op = getComputedStyle(video).objectPosition.split(' ');
    vX.value = parseFloat(op[0]) || 72;
    vY.value = parseFloat(op[1]) || 42;
    function setPos(){ video.style.objectPosition = vX.value + '% ' + vY.value + '%'; save(); }
    vX.addEventListener('input', setPos);
    vY.addEventListener('input', setPos);
  }
  vV.addEventListener('input', function(){
    if(veil) veil.style.opacity = (vV.value / 100).toString();
    save();
  });

  /* ---- persistence ---- */
  var KEY = 'heroEditorLayout';
  function state(){
    var out = { elements: {}, video: null, veilOpacity: vV.value / 100 };
    hero.querySelectorAll('.ed-el').forEach(function(el){
      var hb = hero.getBoundingClientRect(), r = el.getBoundingClientRect();
      out.elements[el.getAttribute('data-edname')] = {
        x: Math.round(parseFloat(el.style.left)),
        y: Math.round(parseFloat(el.style.top)),
        xPct: +(100 * (r.left - hb.left) / hb.width).toFixed(1),
        yPct: +(100 * (r.top - hb.top) / hb.height).toFixed(1),
        width: Math.round(r.width),
        fontSize: getComputedStyle(el).fontSize
      };
    });
    if(video) out.video = { objectPosition: video.style.objectPosition || getComputedStyle(video).objectPosition };
    out.heroSize = { w: Math.round(hero.getBoundingClientRect().width), h: Math.round(hero.getBoundingClientRect().height) };
    return out;
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state())); }catch(_){} }
  function restore(){
    var raw; try{ raw = localStorage.getItem(KEY); }catch(_){}
    if(!raw) return;
    try{
      var st = JSON.parse(raw);
      hero.querySelectorAll('.ed-el').forEach(function(el){
        var it = st.elements && st.elements[el.getAttribute('data-edname')];
        if(!it) return;
        el.style.left = it.x + 'px'; el.style.top = it.y + 'px';
        el.style.width = it.width + 'px'; el.style.fontSize = it.fontSize;
      });
      if(st.video && video){
        video.style.objectPosition = st.video.objectPosition;
        var vp = st.video.objectPosition.split(' ');
        vX.value = parseFloat(vp[0]); vY.value = parseFloat(vp[1]);
      }
      if(st.veilOpacity != null && veil){ veil.style.opacity = st.veilOpacity; vV.value = st.veilOpacity * 100; }
    }catch(_){}
  }
  restore();

  /* ---- export + reset ---- */
  document.getElementById('edExport').addEventListener('click', function(){
    var box = document.getElementById('edout'), ta = document.getElementById('edoutTa');
    ta.value = JSON.stringify(state(), null, 2);
    box.style.display = 'block';
    ta.select();
    try{ document.execCommand('copy'); }catch(_){}
    this.textContent = 'Copied! (Claude ko paste kardo)';
    var b = this; setTimeout(function(){ b.textContent = 'Export layout'; }, 2500);
  });
  document.getElementById('edReset').addEventListener('click', function(){
    try{ localStorage.removeItem(KEY); }catch(_){}
    location.reload();
  });
})();
</script>
</body>
</html>
